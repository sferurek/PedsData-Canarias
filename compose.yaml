services:
  db:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_DB: pedsdata
      POSTGRES_USER: pedsdata
      POSTGRES_PASSWORD: pedsdata_local
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pedsdata -d pedsdata"]
      interval: 2s
      timeout: 3s
      retries: 20
    ports:
      - "55432:5432"
    volumes:
      - pedsdata_pg:/var/lib/postgresql/data

volumes:
  pedsdata_pg:
